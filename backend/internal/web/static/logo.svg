<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 -2.5 64 64" role="img" aria-label="Wool Stock">
  <style>
    .ball { fill: #2e3f8f; }
    .strand { fill: none; stroke: #9aa9ec; stroke-width: 2.2; stroke-linecap: round; }
    .needle { fill: none; stroke: #c08a55; stroke-width: 3.2; stroke-linecap: round; }
    .knob { fill: #8f5a2c; }
    .tail { fill: none; stroke: #2e3f8f; stroke-width: 2.6; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .ball { fill: #a9b8ff; }
      .strand { stroke: #2e3f8f; }
      .tail { stroke: #a9b8ff; }
    }
  </style>
  <defs>
    <clipPath id="ball">
      <circle cx="30" cy="40" r="20"/>
    </clipPath>
  </defs>
  <!-- Aiguilles plantées dans la pelote, croisées au-dessus -->
  <path class="needle" d="M16 33 L41.5 3.6"/>
  <path class="needle" d="M44 33 L18.5 3.6"/>
  <circle class="knob" cx="42.4" cy="2.6" r="3.4"/>
  <circle class="knob" cx="17.6" cy="2.6" r="3.4"/>
  <!-- Pelote et ses brins -->
  <circle class="ball" cx="30" cy="40" r="20"/>
  <g clip-path="url(#ball)">
    <path class="strand" d="M10 43 C18 32 32 25 49 26"/>
    <path class="strand" d="M11 52 C21 40 36 33 51 35"/>
    <path class="strand" d="M17 59 C28 49 40 44 51 45"/>
    <path class="strand" d="M22 21 C31 32 35 46 33 61"/>
  </g>
  <!-- Fil qui s'échappe -->
  <path class="tail" d="M45 53 C50 59 56 60 59 56"/>
</svg>
