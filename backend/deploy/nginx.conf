# Wool Stock — site nginx, à installer en /etc/nginx/sites-available/stock-laine.carin.family.
# Voir docs/deploiement-serveur.md. nginx termine TLS et transmet tout au serveur Go,
# qui n'écoute que sur 127.0.0.1.

upstream wool_stock {
    # Le port de web.port dans /etc/wool-stock/config.yaml.
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name stock-laine.carin.family;

    # Renouvellement d'un certificat obtenu par certbot --webroot : le même dossier que le
    # webroot_path de /etc/letsencrypt/renewal/<nom>.conf. Inutile avec certbot --nginx.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx 1.25.1 et plus ; avant, écrire « listen 443 ssl http2; » à la place.
    http2 on;
    server_name stock-laine.carin.family;

    ssl_certificate     /etc/letsencrypt/live/stock-laine.carin.family/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stock-laine.carin.family/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000" always;

    # Les saisies sont de petits formulaires JSON ou HTML.
    client_max_body_size 1m;

    access_log /var/log/nginx/wool-stock.access.log;
    error_log  /var/log/nginx/wool-stock.error.log;

    location / {
        proxy_pass http://wool_stock;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Le serveur compare l'Origin des formulaires à Host : il doit recevoir le vrai nom.
        proxy_set_header Host $host;
        # IP réelle pour les limites de requêtes et de connexions (web.trusted_proxies).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Cookie de session marqué Secure.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
