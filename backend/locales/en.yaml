privacy.changes: "This policy follows the app and the server: the date at the top of the page gives its latest version."
privacy.changes_title: "Changes"
privacy.contact: "For any question or request about your data, write to:"
privacy.contact_admins: "For any question or request about your data, contact the administrator who created your account."
privacy.controller: "This server, {{.Host}}, is run by {{.Name}}, who is responsible for the data it records."
privacy.controller_admins: "This server, {{.Host}}, is run by its administrators, the people who create its accounts: they are responsible for the data it records."
privacy.controller_title: "Who is responsible"
privacy.lead: "What the app and this site record about you, why, for how long, and how to have it erased."
privacy.phone_camera: "The camera reads the barcode and the text on the label. Images are analysed on the phone, then discarded: they are neither stored nor sent. Only the result of the entry (barcode, brand, colour, dye lot, number of balls) goes to the server, when you confirm it."
privacy.phone_mlkit: "On Android, this reading uses ML Kit, a Google library that runs on the phone. For its diagnostics, ML Kit sends Google technical information about the phone, the app and its own performance; images are not part of it."
privacy.phone_mlkit_link: "What ML Kit sends to Google"
privacy.phone_storage: "The app keeps on the phone the server address, your session, a copy of the brands and colours already known and the last exported workbook. The session is excluded from backups and transfers to another device; signing out erases it."
privacy.phone_title: "What stays on the phone"
privacy.phone_vision: "On iPhone, this reading uses Apple’s Vision, entirely on the phone."
privacy.purposes: "This data is only used to run the stock: knowing who may sign in, keeping a reliable history of who recorded what and for whom, and protecting the service (repeated sign-in attempts, errors). No advertising, no analytics, no profiling."
privacy.purposes_basis: "It rests on the legitimate interest of those who keep the stock together: a shared stock is only reliable if you know who has access and who changed it."
privacy.purposes_title: "Why"
privacy.retention_account: "Your account: until it is deleted, by you or by an administrator. Its sessions go with it."
privacy.retention_backups:
  one: "Database backups: {{.Count}} day. Deleted data disappears from them at most {{.Count}} day later."
  other: "Database backups: {{.Count}} days. Deleted data disappears from them at most {{.Count}} days later."
privacy.retention_history: "The stock history: for as long as the stock is kept. Once an account is deleted, its name stays on the movements already recorded, which make up the stock history."
privacy.retention_logs:
  one: "Technical logs: {{.Count}} day."
  other: "Technical logs: {{.Count}} days."
privacy.retention_sessions:
  one: "A session: until sign-out, or after {{.Count}} day without use."
  other: "A session: until sign-out, or after {{.Count}} days without use."
privacy.retention_sessions_open: "A session: until sign-out or the deletion of the account."
privacy.retention_title: "How long"
privacy.rights: "You may access your data, have it corrected or erased, receive a copy, object to its processing or have its use restricted."
privacy.rights_complaint: "If you believe your rights are not respected, you may lodge a complaint with the data protection authority; in France, the CNIL."
privacy.rights_complaint_link: "Lodge a complaint with the CNIL"
privacy.rights_delete_app: "Delete your account in the app: Settings, then “Delete my account”."
privacy.rights_delete_web: "Delete your account on this site: My account page, after signing in."
privacy.rights_other: "For anything else, including a name recorded as a recipient, contact the person responsible (above)."
privacy.rights_title: "Your rights"
privacy.server_account: "Your account: email address, name and role (administrator or manager), created by an administrator. There is no password: the allowed address is enough to sign in."
privacy.server_devices: "Each signed-in device: the phone model (for example “Google Pixel 6”) or the browser identification, the sign-in date and the date of last use. The session token is only kept as a hash."
privacy.server_history: "The stock history: every entry, exit, count and inventory, with its date and the name of the account that recorded it."
privacy.server_logs: "Technical logs: for each request, the IP address, date, page requested and browser; for each sign-in and account change, the email address concerned."
privacy.server_recipients: "For an exit, the name of the person the balls are given to, as typed. That person needs no account and has the same rights over this name."
privacy.server_title: "What the server records"
privacy.sharing_admins: "Administrators also see the accounts: email address, name, role, signed-in devices and last activity."
privacy.sharing_cookie: "The site uses a single cookie, the session cookie, needed to stay signed in: no analytics or advertising cookies."
privacy.sharing_members: "People with an account see the stock and its history, hence the names of authors and recipients."
privacy.sharing_none: "The recorded data stays on this server: nothing is sold, rented or shared. Exchanges with it are encrypted (HTTPS)."
privacy.sharing_title: "Who sees it"
privacy.title: "Privacy policy"
privacy.updated: "Last updated {{.Date}}."
