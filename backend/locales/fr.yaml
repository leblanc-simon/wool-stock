my_account.title: "Mon compte"
privacy.changes: "Ces règles suivent l’app et le serveur : la date en haut de page donne leur dernière version."
privacy.changes_title: "Évolutions"
privacy.contact: "Pour toute question ou demande sur vos données, écrivez à :"
privacy.contact_admins: "Pour toute question ou demande sur vos données, adressez-vous à l’administrateur qui a créé votre compte."
privacy.controller: "Ce serveur, {{.Host}}, est tenu par {{.Name}}, responsable des données qu’il enregistre."
privacy.controller_admins: "Ce serveur, {{.Host}}, est tenu par ses administrateurs, ceux qui y créent les comptes : ils sont responsables des données qu’il enregistre."
privacy.controller_title: "Responsable"
privacy.lead: "Ce que l’application et ce site enregistrent sur vous, pourquoi, pour combien de temps, et comment le faire effacer."
privacy.phone_camera: "La caméra sert à lire le code-barres et le texte de l’étiquette. Les images sont analysées sur le téléphone, puis oubliées : elles ne sont ni enregistrées ni envoyées. Seul le résultat de la saisie (code-barres, marque, coloris, bain, nombre de pelotes) part au serveur, quand vous la validez."
privacy.phone_mlkit: "Sur Android, cette lecture passe par ML Kit, une bibliothèque de Google qui fonctionne sur le téléphone. Pour son diagnostic, ML Kit envoie à Google des informations techniques sur le téléphone, l’app et ses propres performances ; les images n’en font pas partie."
privacy.phone_mlkit_link: "Ce que ML Kit envoie à Google"
privacy.phone_storage: "L’app garde sur le téléphone l’adresse du serveur, votre session, une copie des marques et coloris déjà connus et le dernier classeur exporté. La session est exclue des sauvegardes et des transferts vers un autre appareil ; se déconnecter l’efface."
privacy.phone_title: "Ce qui reste sur le téléphone"
privacy.phone_vision: "Sur iPhone, cette lecture passe par Vision, d’Apple, entièrement sur le téléphone."
privacy.purposes: "Ces données servent seulement à faire fonctionner le stock : savoir qui peut s’y connecter, garder un historique fiable de qui a saisi quoi et pour qui, et protéger le service (tentatives de connexion répétées, erreurs). Ni publicité, ni mesure d’audience, ni profilage."
privacy.purposes_basis: "Elles reposent sur l’intérêt légitime de ceux qui tiennent le stock ensemble : un stock partagé n’est fiable que si l’on sait qui y a accès et qui l’a modifié."
privacy.purposes_title: "Pourquoi"
privacy.retention_account: "Votre compte : jusqu’à sa suppression, par vous ou par un administrateur. Ses sessions disparaissent avec lui."
privacy.retention_backups:
  one: "Les sauvegardes de la base : {{.Count}} jour. Une donnée supprimée en disparaît au plus tard {{.Count}} jour après."
  many: "Les sauvegardes de la base : {{.Count}} jours. Une donnée supprimée en disparaît au plus tard {{.Count}} jours après."
  other: "Les sauvegardes de la base : {{.Count}} jours. Une donnée supprimée en disparaît au plus tard {{.Count}} jours après."
privacy.retention_history: "L’historique du stock : tant que le stock est tenu. Après la suppression d’un compte, son nom reste sur les mouvements déjà saisis, qui font l’historique du stock."
privacy.retention_logs:
  one: "Les journaux techniques : {{.Count}} jour."
  many: "Les journaux techniques : {{.Count}} jours."
  other: "Les journaux techniques : {{.Count}} jours."
privacy.retention_sessions:
  one: "Une session : jusqu’à la déconnexion, ou après {{.Count}} jour sans utilisation."
  many: "Une session : jusqu’à la déconnexion, ou après {{.Count}} jours sans utilisation."
  other: "Une session : jusqu’à la déconnexion, ou après {{.Count}} jours sans utilisation."
privacy.retention_sessions_open: "Une session : jusqu’à la déconnexion, ou la suppression du compte."
privacy.retention_title: "Combien de temps"
privacy.rights: "Vous pouvez consulter vos données, les faire corriger ou effacer, en recevoir une copie, vous opposer à leur traitement ou en faire limiter l’usage."
privacy.rights_complaint: "Si vous estimez que vos droits ne sont pas respectés, vous pouvez saisir l’autorité de protection des données ; en France, la CNIL."
privacy.rights_complaint_link: "Adresser une plainte à la CNIL"
privacy.rights_delete_app: "Supprimer votre compte dans l’app : Réglages, puis « Supprimer mon compte »."
privacy.rights_delete_web: "Supprimer votre compte sur ce site : page Mon compte, après connexion."
privacy.rights_other: "Pour le reste, y compris pour un nom saisi comme destinataire, adressez-vous au responsable (ci-dessus)."
privacy.rights_title: "Vos droits"
privacy.server_account: "Votre compte : adresse email, nom et droit (administrateur ou gestionnaire), créé par un administrateur. Il n’y a pas de mot de passe : l’adresse autorisée suffit pour se connecter."
privacy.server_devices: "Chaque appareil connecté : le modèle du téléphone (par exemple « Google Pixel 6 ») ou l’identification du navigateur, la date de connexion et celle de la dernière utilisation. Le jeton de session n’est gardé que sous forme d’empreinte."
privacy.server_history: "L’historique du stock : chaque entrée, sortie, comptage et inventaire, avec sa date et le nom du compte qui l’a saisi."
privacy.server_logs: "Des journaux techniques : pour chaque requête, l’adresse IP, la date, la page demandée et le navigateur ; pour chaque connexion et chaque changement de compte, l’adresse email concernée."
privacy.server_recipients: "Pour une sortie, le nom de la personne à qui les pelotes sont remises, tel qu’il a été saisi. Cette personne n’a pas besoin de compte, et dispose des mêmes droits sur ce nom."
privacy.server_title: "Ce que le serveur enregistre"
privacy.sharing_admins: "Les administrateurs voient en plus les comptes : adresse email, nom, droit, appareils connectés et dernière activité."
privacy.sharing_cookie: "Le site n’emploie qu’un cookie, celui de la session, nécessaire pour rester connecté : aucun cookie de mesure d’audience ni de publicité."
privacy.sharing_members: "Les personnes qui ont un compte voient le stock et son historique, donc les noms des auteurs et des destinataires."
privacy.sharing_none: "Les données enregistrées restent sur ce serveur : rien n’est vendu, loué ni partagé. Les échanges avec lui sont chiffrés (HTTPS)."
privacy.sharing_title: "Qui les voit"
privacy.title: "Règles de confidentialité"
