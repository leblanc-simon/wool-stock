my_account.delete_confirm: "Oui, supprimer définitivement mon compte"
my_account.delete_help: "Votre adresse ne sera plus autorisée et tous vos appareils seront déconnectés, application comme navigateur. Votre nom reste sur les entrées, sorties et inventaires déjà saisis : ils font partie de l’historique du stock. Pour revenir, demandez à un administrateur de recréer votre compte."
my_account.delete_open: "Supprimer mon compte…"
